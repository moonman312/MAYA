# Fill project_id after `supabase link`, or leave empty for local-only workflows.
# project_id = "your-project-ref"

[api]
enabled = true

[functions]
# Default verify_jwt can be overridden per function below.

[functions.mews-scheduled-sync]
# pg_cron + Vault typically cannot send a user JWT; validate x-mews-cron-secret instead.
verify_jwt = false

[functions.cloudbeds-scheduled-sync]
# pg_cron + Vault typically cannot send a user JWT; validate x-cloudbeds-cron-secret instead.
verify_jwt = false

[functions.onboarding-import-worker]
# pg_cron + Vault typically cannot send a user JWT; validate x-onboarding-cron-secret instead.
verify_jwt = false
